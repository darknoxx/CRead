[workspace]
resolver = "3"
members = ["crates/core", "crates/render", "crates/sync", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
cread-core = { path = "crates/core" }
cread-render = { path = "crates/render" }
cread-sync = { path = "crates/sync" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Fast iteration: keep wgpu/winit optimised even in debug builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
