[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/render",
    "crates/sync",
    "crates/app",
    "crates/programs/softhand",
    "crates/programs/pocketboi",
]

[workspace.package]
version = "0.13.3"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
cread-core = { path = "crates/core" }
cread-render = { path = "crates/render" }
cread-sync = { path = "crates/sync" }
cread-softhand = { path = "crates/programs/softhand" }
cread-pocketboi = { path = "crates/programs/pocketboi" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Fast iteration: keep wgpu/winit optimised even in debug builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Mizu is vendored with three small patches (see vendor/README.md): a debug
# print in the CPU loop, a panic on illegal opcodes, and an assert while
# loading save states.
[patch.crates-io]
mizu-core = { path = "vendor/mizu-core" }
