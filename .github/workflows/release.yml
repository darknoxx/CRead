name: Release build

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # One glibc baseline for both architectures. The arm64 image is native on
    # the arm runner, so this is not a cross build.
    container: ubuntu:22.04
    env:
      DIST: cread-linux-${{ matrix.arch }}
    steps:
      - name: Bootstrap
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl \
            build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            libasound2-dev libudev-dev \
            libssl-dev

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p dist
          strip target/release/cread
          cp target/release/cread dist/
          cp README.md LICENSE THIRD-PARTY.md minisign.pub dist/
          cp assets/fonts/README.md dist/FONTS.md
          cp docs/raspberry-pi.md dist/RASPBERRY-PI.md
          cp -r packaging dist/packaging
          printf '%s\n' \
            "commit: ${GITHUB_SHA}" \
            "ref:    ${GITHUB_REF_NAME}" \
            "arch:   ${{ matrix.arch }}" \
            "built:  $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "glibc:  $(ldd --version | head -1)" \
            "run:    ./cread --help" \
            > dist/VERSION.txt
          tar -C dist -czf "${DIST}.tar.gz" .
          ls -lh "${DIST}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DIST }}
          path: ${{ env.DIST }}.tar.gz
          if-no-files-found: error
          retention-days: 90

  publish:
    name: sign and publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Download both architectures
        uses: actions/download-artifact@v8
        with:
          pattern: cread-linux-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          for file in *.tar.gz; do
            sha256sum "$file" > "$file.sha256"
          done
          ls -lh

      - name: Sign
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          if [ -z "$MINISIGN_KEY" ]; then
            echo "MINISIGN_KEY is not set: the updater refuses unsigned releases."
            exit 1
          fi
          cargo install rsign2 --locked --root /tmp/rsign >/dev/null
          printf '%s\n' "$MINISIGN_KEY" > /tmp/minisign.key
          chmod 600 /tmp/minisign.key
          cd dist
          for file in *.tar.gz; do
            /tmp/rsign/bin/rsign sign -W -s /tmp/minisign.key "$file"
          done
          rm -f /tmp/minisign.key
          ls -l

      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="## ${version}" '
            $0 == ver        { found = 1; next }
            found && /^## / { exit }
            found            { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "release notes for ${version}: $(wc -l < RELEASE_NOTES.md) lines"
          head -3 RELEASE_NOTES.md

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.tar.gz.minisig
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
