name: Release build

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  DIST: cread-linux-x86_64

jobs:
  linux:
    name: linux x86_64
    runs-on: ubuntu-latest
    # Build against glibc 2.35 so the binary also runs on Ubuntu 22.04, not just
    # on whatever the runner image happens to ship.
    container: ubuntu:22.04
    steps:
      - name: Bootstrap
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl \
            build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            libasound2-dev \
            libssl-dev

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p dist
          strip target/release/cread
          cp target/release/cread dist/
          cp README.md dist/
          # The sample diskettes travel with the binary: without RIFF.DSK
          # there is no Riff on the boot screen of a fresh download.
          mkdir -p dist/disks
          cp examples/disks/*.DSK dist/disks/
          printf '%s\n' \
            "commit: ${GITHUB_SHA}" \
            "ref:    ${GITHUB_REF_NAME}" \
            "built:  $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "glibc:  $(ldd --version | head -1)" \
            "run:    ./cread --help" \
            > dist/VERSION.txt
          tar -C dist -czf "${DIST}.tar.gz" .
          sha256sum "${DIST}.tar.gz" | tee "${DIST}.tar.gz.sha256"
          ls -lh "${DIST}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DIST }}
          path: |
            ${{ env.DIST }}.tar.gz
            ${{ env.DIST }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          # awk, not python: the ubuntu:22.04 image has no python3.
          awk -v ver="## ${version}" '
            $0 == ver        { found = 1; next }
            found && /^## / { exit }
            found            { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "release notes for ${version}: $(wc -l < RELEASE_NOTES.md) lines"
          head -3 RELEASE_NOTES.md

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.DIST }}.tar.gz
            ${{ env.DIST }}.tar.gz.sha256
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
