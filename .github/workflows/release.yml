name: Release build

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  DIST: cread-linux-x86_64

jobs:
  linux:
    name: linux x86_64
    runs-on: ubuntu-latest
    # Build against glibc 2.35 so the binary also runs on Ubuntu 22.04, not just
    # on whatever the runner image happens to ship.
    container: ubuntu:22.04
    steps:
      - name: Bootstrap
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl \
            build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            libssl-dev

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p dist
          strip target/release/cread
          cp target/release/cread dist/
          cp README.md dist/
          printf '%s\n' \
            "commit: ${GITHUB_SHA}" \
            "ref:    ${GITHUB_REF_NAME}" \
            "built:  $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "glibc:  $(ldd --version | head -1)" \
            "run:    ./cread --help" \
            > dist/VERSION.txt
          tar -C dist -czf "${DIST}.tar.gz" .
          sha256sum "${DIST}.tar.gz" | tee "${DIST}.tar.gz.sha256"
          ls -lh "${DIST}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DIST }}
          path: |
            ${{ env.DIST }}.tar.gz
            ${{ env.DIST }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - "${GITHUB_REF_NAME#v}" <<'EOF'
          import pathlib, re, sys
          version = sys.argv[1]
          text = pathlib.Path('CHANGELOG.md').read_text()
          match = re.search(rf'^## {re.escape(version)}\n(.*?)(?=^## |\Z)', text, re.S | re.M)
          notes = match.group(1).strip() if match else ''
          pathlib.Path('RELEASE_NOTES.md').write_text(notes + '\n')
          print(f"notes for {version}: {len(notes)} characters")
          EOF

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.DIST }}.tar.gz
            ${{ env.DIST }}.tar.gz.sha256
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
